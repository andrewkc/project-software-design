services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dessof_test
      POSTGRES_USER: dessof
      POSTGRES_PASSWORD: local_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dessof -d dessof_test"]
      interval: 2s
      retries: 15

  tests:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app
    volumes:
      - .:/app
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dessof_test
      POSTGRES_USER: dessof
      POSTGRES_PASSWORD: local_test_only
      DJANGO_DEBUG: "1"
      GEMINI_API_KEY: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app/backend
    volumes:
      - .:/app
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dessof_test
      POSTGRES_USER: dessof
      POSTGRES_PASSWORD: local_test_only
      DJANGO_DEBUG: "1"
      DESSOF_DEMO_PASSWORD: "LocalDemoPass123!"
      DJANGO_ALLOWED_HOSTS: web,localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:55123,http://localhost:55123
      GEMINI_API_KEY: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "--noreload"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_test_modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://web:8000
    ports:
      - "127.0.0.1:55123:5173"
    depends_on:
      - web
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]

volumes:
  frontend_test_modules:
