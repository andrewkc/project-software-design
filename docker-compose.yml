name: bodesmart

services:
  database:
    container_name: database
    image: theandrewkc/bodesmart-database:latest
    build:
      context: ./apps/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodesmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-bodesmart}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - bodesmart

  backend:
    container_name: backend
    image: theandrewkc/bodesmart-backend:latest
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bodesmart}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}@database:5432/${POSTGRES_DB:-bodesmart}
      BODESMART_SECRET: ${BODESMART_SECRET:?Definir BODESMART_SECRET en .env}
      ALLOW_SIMULATED_PAYMENT: ${ALLOW_SIMULATED_PAYMENT:-true}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.bodesmart.online,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_ALLOWED_MODELS: ${GEMINI_ALLOWED_MODELS:-gemini-3.1-flash-lite,gemini-3.5-flash-lite}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/interactions}
      OPEN_FOOD_FACTS_API_URL: ${OPEN_FOOD_FACTS_API_URL:-https://world.openfoodfacts.org/api/v2/product}
      OPEN_FOOD_FACTS_USER_AGENT: ${OPEN_FOOD_FACTS_USER_AGENT:-BodeSmart/0.1 (local-prototype)}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - bodesmart

  operations-web:
    container_name: operations-web
    image: theandrewkc/bodesmart-operations-web:latest
    build:
      context: ./apps/operations-web
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.bodesmart.online}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3002}:${WEB_CONTAINER_PORT:-80}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bodesmart

  customer-web:
    container_name: customer-web
    image: theandrewkc/bodesmart-customer-web:latest
    build:
      context: ./apps/customer-web
      dockerfile: ${CUSTOMER_DOCKERFILE:-Dockerfile}
      args:
        VITE_API_BASE_URL: ${CUSTOMER_VITE_API_BASE_URL:-http://127.0.0.1:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CUSTOMER_PORT:-5174}:${CUSTOMER_CONTAINER_PORT:-80}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bodesmart

  admin-web:
    container_name: admin-web
    image: theandrewkc/bodesmart-admin-web:latest
    build:
      context: ./apps/admin-web
      dockerfile: ${ADMIN_DOCKERFILE:-Dockerfile}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.bodesmart.online}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5175}:${ADMIN_CONTAINER_PORT:-80}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bodesmart

volumes:
  db-data:
    name: bodesmart-db

networks:
  bodesmart:
    name: bodesmart
