services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dessof}
      POSTGRES_USER: ${POSTGRES_USER:-dessof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dessof}
      POSTGRES_USER: ${POSTGRES_USER:-dessof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: bodesmart.shop,www.bodesmart.shop
      DJANGO_CSRF_TRUSTED_ORIGINS: https://bodesmart.shop,https://www.bodesmart.shop
    volumes:
      - ml_models:/app/backend/media/ml_models
      - django_static:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30"]

  site:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - django_static:/srv/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  ml_models:
  django_static:
  caddy_data:
  caddy_config:
